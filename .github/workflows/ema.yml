name: EMA185 4H Signal Scanner

# Cek sinyal break EMA185 di timeframe 4H tiap 15 menit (dedup per candle di DB),
# plus bisa dijalankan manual dari tab Actions.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ema-scanner
  cancel-in-progress: false

jobs:
  ema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r pair-trading-v2/requirements.txt

      - name: Run EMA185 scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXTENDED_BASE_URL: https://api.starknet.extended.exchange
        run: python ema_runner.py

name: Trading Signal Scanner (24/7)

# Berjalan otomatis tiap 15 menit + bisa dijalankan manual dari tab Actions.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Hindari dua scan bertumpuk kalau satu run lambat.
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXTENDED_BASE_URL: https://api.starknet.extended.exchange
        run: python scanner.py
